name: Zig Core

on:
  push:
    branches: [main, zig-agent-v2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build Zig core
        working-directory: zig
        run: zig build -Doptimize=ReleaseSafe
      - name: Smoke test agent protocol
        working-directory: zig
        shell: bash
        run: |
          printf 'status\ntask Open Notepad\nverify task-001\nquit\n' | ./zig-out/bin/pickleai-core > smoke-output.txt
          grep -q '"type":"status"' smoke-output.txt
          grep -q '"type":"plan"' smoke-output.txt
          grep -q '"type":"task"' smoke-output.txt
          grep -q '"type":"verification"' smoke-output.txt
