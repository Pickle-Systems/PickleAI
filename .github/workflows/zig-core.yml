name: Zig Core

on:
  push:
    branches: [main, zig-agent-v2]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build Zig core
        working-directory: zig
        run: zig build -Doptimize=ReleaseSafe
